<!-- RODAPÉ URE LESTE 3 -->
<div class="ure-footer-wrapper">
    <style>
        .ure-footer-wrapper {
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            padding: 30px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden; /* Impede que a imagem vaze e crie scroll */
            position: relative; /* Necessário para o contador não vazar */
        }
        .ure-footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .ure-info-text {
            flex: 1;
            text-align: center;
            min-width: 300px;
        }
        .ure-info-text h3 {
            color: #000000;
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-weight: 600;
        }
        .ure-info-text p {
            color: #555555;
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 0;
        }
        .ure-info-text .ure-email {
            margin-top: 8px;
            font-weight: 500;
            color: #333;
        }
        .ure-mascote-box {
            position: relative;
            width: 380px;
            max-width: 100%;
            flex-shrink: 0;
            margin: 0 auto;
        }
        .ure-mascote-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .ure-contador-overlay {
            position: absolute;
            top: 26%;
            left: 40%;
            width: 50%;
            height: 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .ure-contador-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #666666;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .ure-contador-num {
            font-size: 2.8rem;
            font-weight: 800;
            color: #002776;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 850px) {
            .ure-footer-container {
                flex-direction: column-reverse;
                gap: 15px;
            }
            .ure-mascote-box { width: 300px; }
            .ure-contador-num { font-size: 2rem; }
            .ure-contador-label { font-size: 0.6rem; }
        }
    </style>

    <div class="ure-footer-container">
        
        <!-- Textos da URE -->
        <div class="ure-info-text">
            <h3>UNIDADE REGIONAL DE ENSINO - LESTE 3</h3>
            <p>Rua Isabel Urbina, 200 - CEP 08253-210 - Conjunto Habitacional José Bonifácio - Itaquera - São Paulo - Brasil</p>
            <p class="ure-email">Email: lt3@educacao.sp.gov.br</p>
        </div>

        <!-- Mascote e Contador -->
        <div class="ure-mascote-box">
            <!-- Link direto da imagem no seu GitHub Pages -->
            <img src="https://matheusoliveira07-maker.github.io/contador-visitas/mascote-quadro.png" alt="Mascote Jaguatirica">
            
            <div class="ure-contador-overlay">
                <span class="ure-contador-label">Visitas ao site</span>
                <div class="ure-contador-num" id="ure-numero-visitas">...</div>
            </div>
        </div>
    </div>

    <!-- Script do Contador -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var el = document.getElementById("ure-numero-visitas");
            
            function animar(elemento, valorFinal) {
                let atual = 0;
                let incremento = Math.ceil(valorFinal / 30) || 1;
                let timer = setInterval(() => {
                    atual += incremento;
                    if (atual >= valorFinal) {
                        elemento.innerText = valorFinal;
                        clearInterval(timer);
                    } else {
                        elemento.innerText = atual;
                    }
                }, 40);
            }

            fetch('https://api.counterapi.dev/v1/ure-leste3/visitas/up')
                .then(res => res.json())
                .then(data => {
                    if(data && data.count) {
                        animar(el, data.count);
                    } else {
                        animar(el, 150); // Fallback de teste
                    }
                })
                .catch(err => {
                    console.warn("API bloqueada. Usando fallback.", err);
                    animar(el, 150); // Mostra 150 se a API falhar no CMS
                });
        });
    </script>
</div>
