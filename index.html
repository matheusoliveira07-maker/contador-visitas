            max-height: 350px;
        }
        .ure-footer-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

        }
        .ure-info-text {
            flex: 1;
            text-align: center;
            min-width: 280px;
        }
        .ure-info-text h3 {
            color: #000000;
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: 600;
        }
        .ure-info-text p {
            color: #555555;
            font-size: 0.85rem;
            line-height: 1.4;
            margin: 0;
        }
        .ure-info-text .ure-email {
            margin-top: 5px;
            font-weight: 500;
            color: #333;
        }
        .ure-mascote-box {
            position: relative;
            width: 320px;
            max-width: 100%;
            flex-shrink: 0;
            margin: 0 auto;
        }
        .ure-mascote-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .ure-contador-overlay {
            position: absolute;
            top: 26%;
            left: 45%;
            width: 50%;
            height: 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .ure-contador-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #666666;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .ure-contador-num {
            font-size: 2.2rem;
            font-weight: 800;
            color: #002776;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 850px) {
            .ure-footer-container {
                flex-direction: column-reverse;
                gap: 10px;
            }
            .ure-mascote-box { width: 250px; }
            .ure-contador-num { font-size: 1.8rem; }
            .ure-footer-wrapper { max-height: none; }

    </style>

    <div class="ure-footer-container">
        <div class="ure-info-text">
            <h3>UNIDADE REGIONAL DE ENSINO - LESTE 3</h3>
            <p>Rua Isabel Urbina, 200 - CEP 08253-210 - Conjunto Habitacional José Bonifácio - Itaquera - São Paulo - Brasil</p>
            <p class="ure-email">Email: lt3@educacao.sp.gov.br</p>
        </div>

        <div class="ure-mascote-box">
            <img src="https://matheusoliveira07-maker.github.io/contador-visitas/mascote-quadro.png" alt="Mascote Jaguatirica">
            
            <div class="ure-contador-overlay">
                <span class="ure-contador-label">Visitas</span>
                <!-- O ID aqui precisa ser 'ure-numero-visitas' para o script funcionar -->
                <div class="ure-contador-num" id="ure-numero-visitas">...</div>
            </div>
        </div>
    </div>

    <!-- Script do Contador com a API Abacus -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var el = document.getElementById("ure-numero-visitas");
            
            function animar(elemento, valorFinal) {
                let atual = 0;
                let incremento = Math.ceil(valorFinal / 30) || 1;
                let timer = setInterval(() => {
                    atual += incremento;
                    if (atual >= valorFinal) {
                        elemento.innerText = valorFinal;
                        clearInterval(timer);
                    } else {
                        elemento.innerText = atual;
                    }
                }, 40);
            }

            // API Abacus (Nova)
            fetch('https://abacus.jasonkelly.dev/api/v1/counter/ure_leste_3_visitas/up')
                .then(res => res.json())
                .then(data => {
                    if(data && data.value) {
                        animar(el, data.value);
                    } else {
                        animar(el, 0); // Se a API não retornar número, mostra 0
                    }
                })
                .catch(err => {
                    console.warn("API bloqueada. Mostrando 0.", err);
                    animar(el, 0); 
                });
        });
    </script>
</div>
