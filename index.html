<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodapé - URE Leste 3</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Simulação do fundo do seu site */
        body {
            background-color: #f9f9f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- ESTILOS DO RODAPÉ --- */
        .footer-ure {
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            padding: 40px 20px 40px 20px;
            margin-top: auto;
            width: 100%;
            position: relative;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        /* --- COLUNA CENTRAL: INFORMAÇÕES DA URE --- */
        .info-ure {
            flex: 1;
            text-align: center;
            min-width: 300px;
        }

        .info-ure h3 {
            color: #000000;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .info-ure p {
            color: #555555;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .info-ure .email {
            margin-top: 10px;
            font-weight: 500;
            color: #333;
        }

        /* --- COLUNA DIREITA: MASCOTE COM QUADRO --- */
        .mascote-container {
            position: relative;
            width: 500px; /* Tamanho máximo da imagem */
            max-width: 100%;
        }

        .mascote-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* O Contador posicionado DENTRO do quadro */
        .contador-dentro-quadro {
            position: absolute;
            /* Ajuste esses valores para o texto encaixar perfeitamente no quadro branco */
            top: 25%; 
            left: 42%; 
            width: 50%;
            height: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contador-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666666;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .contador-numero {
            font-size: 3.5rem;
            font-weight: 800;
            color: #002776; /* Azul escuro combinando com a moldura */
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        /* Responsividade para celular */
        @media (max-width: 950px) {
            .footer-container {
                flex-direction: column-reverse; /* Contador em cima, Info embaixo */
                gap: 20px;
            }
            .mascote-container {
                width: 400px; /* Reduz a imagem no celular */
                margin: 0 auto;
            }
            .contador-numero {
                font-size: 2.5rem; /* Reduz a fonte */
            }
            .contador-label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- Seu conteúdo principal vai aqui em cima -->

    <!-- RODAPÉ -->
    <footer class="footer-ure">
        <div class="footer-container">
            
            <!-- Lado Esquerdo (Invisível para centralizar o texto) -->
            <div style="flex: 0.2;"></div>

            <!-- Informações da URE (Centro) -->
            <div class="info-ure">
                <h3>UNIDADE REGIONAL DE ENSINO - LESTE 3</h3>
                <p>Rua Isabel Urbina, 200 - CEP 08253-210 - Conjunto Habitacional José Bonifácio - Itaquera - São Paulo - Brasil</p>
                <p class="email">Email: lt3@educacao.sp.gov.br</p>
            </div>

            <!-- Mascote e Contador (Direita) -->
            <div class="mascote-container">
                <!-- Nome da nova imagem -->
                <img src="mascote-quadro.png" alt="Mascote Jaguatirica URE Leste 3" class="mascote-img">
                
                <!-- Contador sobreposto -->
                <div class="contador-dentro-quadro">
                    <span class="contador-label">Visitas ao site</span>
                    <div class="contador-numero" id="numero-visitas">0</div>
                </div>
            </div>

        </div>
    </footer>

    <!-- SCRIPT DO CONTADOR -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const numeroVisitasElement = document.getElementById("numero-visitas");
            
            // API global para contar visitas reais
            fetch('https://api.counterapi.dev/v1/ure-leste3/visitas/up')
                .then(response => response.json())
                .then(data => {
                    const totalVisitas = data.count;
                    animarContador(numeroVisitasElement, totalVisitas);
                })
                .catch(error => {
                    console.error("Erro no contador:", error);
                    numeroVisitasElement.innerText = "---";
                });

            function animarContador(elemento, valorFinal) {
                let valorAtual = 0;
                const incremento = Math.ceil(valorFinal / 50);
                const duracao = 1500; 
                const passo = duracao / (valorFinal / incremento);

                const timer = setInterval(() => {
                    valorAtual += incremento;
                    if (valorAtual >= valorFinal) {
                        elemento.innerText = valorFinal;
                        clearInterval(timer);
                    } else {
                        elemento.innerText = valorAtual;
                    }
                }, passo);
            }
        });
    </script>
</body>
</html>
